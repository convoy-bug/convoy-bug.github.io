const antiVideoData = [
    { src:"videos/anti/1.mp4" },
    { src:"videos/anti/2.mp4" },
    { src:"videos/anti/3.mp4" }
];

let filteredVideos = videoData;

if(selectedTagIDs.length){
    filteredVideos = videoData.filter(v =>
        v.tags.some(t=>selectedTagIDs.includes(t))
    );
}

function injectAntiVideos(videos, antiVideos, interval=8){
    const res=[];
    let ai=0;

    for(let i=0;i<videos.length;i++){
        res.push(videos[i]);

        if((i+1)%interval===0 && antiVideos.length){
            res.push({
                ...antiVideos[ai],
                isAnti:true
            });
            ai=(ai+1)%antiVideos.length;
        }
    }
    return res;
}

const mergedVideos = injectAntiVideos(filteredVideos, antiVideoData, 8);
const appVideos = document.getElementById("appVideos");

/* ---------------------------
   RENDER
----------------------------*/
function renderVideos(){
    mergedVideos.forEach((v,i)=>{
        const el=document.createElement("div");
        el.className="video";
        el.dataset.index=i;

        el.innerHTML=`
        <video class="video_player"
            src="${v.src}"
            loop
            playsinline
            webkit-playsinline
            preload="auto"
            muted
        ></video>`;

        appVideos.appendChild(el);
    });
}
renderVideos();

/* ---------------------------
   IOS SAFE PLAY
----------------------------*/
function safePlay(video){
    if(!video) return;

    video.muted = true;

    const p = video.play();
    if(p){
        p.catch(()=>{});
    }
}

/* ---------------------------
   RESTORE POSITION
----------------------------*/
window.addEventListener("load", () => {

    const savedIndex =
        parseInt(localStorage.getItem("resumeVideoIndex"));

    const startIndex =
        !isNaN(savedIndex) ? savedIndex : 0;

    const target = document.querySelector(
        `.video[data-index="${startIndex}"]`
    );

    if(target){
        target.scrollIntoView({behavior:"auto"});
        currentVideoIndex = startIndex;

        /* rebuild counters */
        realIndexSeen = 0;
        seenReal.clear();

        for(let i=0;i<=startIndex;i++){

            if(mergedVideos[i] && !mergedVideos[i].isAnti){

                seenReal.add(i);
                realIndexSeen++;
            }
        }

        localStorage.setItem(
            "videosScrolled",
            realIndexSeen
        );

        console.log(
            "[RESTORE] Videos viewed:",
            realIndexSeen
        );
    }
});

/* ---------------------------
   ANTI FLOW
----------------------------*/
function runAntiFlow(video,index){

    if(scrollLocked) return;
    if(mergedVideos[index]?.isAnti !== true) return;

    if(mergedVideos[index]?.isAnti === false){
        return;
    }

    if(activeFlowIndex === index) return;
    activeFlowIndex = index;

    scrollLocked = true;

    const antiCount =
        mergedVideos.slice(0,index+1)
            .filter(v=>v.isAnti).length;

    video.pause();
    video.currentTime = 0;

    safePlay(video);

    localStorage.setItem(
        "resumeVideoIndex",
        index + 1
    );

    setTimeout(()=>{

        scrollLocked = false;
        activeFlowIndex = null;

        if(antiCount >= 3){

            localStorage.setItem(
                "resultType",
                "fail"
            );

            window.location.href="results.html";

        } else {

            window.location.href="checkpoint.html";
        }

    }, 3000);
}

/* ---------------------------
   OBSERVER
----------------------------*/
let lastIndex = -1;

const observer = new IntersectionObserver(entries=>{

    entries.forEach(entry=>{

        const card = entry.target;
        const video = card.querySelector("video");
        const index = parseInt(card.dataset.index);

        if(!entry.isIntersecting || entry.intersectionRatio < 0.6){
            video.pause();
            return;
        }

        if(index === lastIndex) return;
        lastIndex = index;

        currentVideoIndex = index;
        manuallyPaused = false;

        safePlay(video);

        const isAnti = mergedVideos[index]?.isAnti;

        /* REAL VIDEO TRACKING */
        if(!isAnti){

    if(!seenReal.has(index)){
        seenReal.add(index);
        realIndexSeen++;

        localStorage.setItem(
            "videosViewed",
            realIndexSeen
        );

        console.log(
            "[VIDEO VIEWED]",
            "Real Videos Viewed:",
            realIndexSeen
        );
    }

    if(realIndexSeen >= filteredVideos.length){
        localStorage.removeItem("resumeVideoIndex");
        window.location.href="results.html";
        return;
    }
}

        if(isAnti && !scrollLocked){

    console.log(
        "[ANTI VIDEO PENDING]",
        "Index:",
        index
    );

    // prevent instant trigger during scroll momentum (iOS fix)
    setTimeout(() => {

        const cardNow =
            document.querySelector(`.video[data-index="${index}"]`);

        if(!cardNow) return;

        const rect = cardNow.getBoundingClientRect();
        const fullyCentered =
            rect.top >= 0 &&
            rect.top < window.innerHeight * 0.25;

        // only trigger if STILL centered after delay
        if(fullyCentered && !scrollLocked){

            console.log(
                "[ANTI VIDEO CONFIRMED]",
                "Triggering flow:",
                index
            );

            runAntiFlow(video, index);
        }

    }, 250);
}
    });

},{threshold:0.6});

document.querySelectorAll(".video")
.forEach(card=>observer.observe(card));

/* ---------------------------
   TAP TOGGLE
----------------------------*/
document.body.addEventListener("click",(e)=>{
    const video = e.target.closest(".video")?.querySelector("video");
    if(!video) return;

    if(video.paused){

        manuallyPaused=false;
        safePlay(video);

    }else{

        manuallyPaused=true;
        video.pause();
    }
});

function getRealIndex(index){

    let count = 0;

    for(let i = 0; i <= index; i++){

        if(!mergedVideos[i].isAnti){
            count++;
        }
    }

    return count;
}
