<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- mobile support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <title>TikTokClone</title>
    <link rel="stylesheet" href="video.css" />

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            overscroll-behavior: none;
            -webkit-overflow-scrolling: touch;
        }

        .app_videos {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
        }

        .video {
            height: 100vh;
            scroll-snap-align: start;
        }
    </style>
</head>
<body>

    <div class="app_videos" id="appVideos"></div>

    <script>

        let scrollCount =
            parseInt(localStorage.getItem("scrollCount")) || 0;

        let currentVideoIndex = -1;
        let manuallyPaused = false;
        let scrollLocked = false;

        const params = new URLSearchParams(window.location.search);

        const selectedTags = [];

        params.forEach((value, key) => {

            if (value === "on") {
                selectedTags.push(key);
            }
        });

        const TAGS = {
            funny: 1,
            absurd: 2,
            relatable: 3,
            skit: 4,
            popculture: 5,
            meme: 6,
            AI: 7,
            lifestyle: 8,
            informative: 9,
            food: 10,
            movie: 11,
            vlog: 12,
            critique: 13,
            filipino: 14
        };

        const selectedTagIDs = selectedTags
            .map(tag => TAGS[tag])
            .filter(Boolean);

        const videoData = [ 
            { src: "videos/1.mp4", tags: [1,4,3,14] }, 
            { src: "videos/2.mp4", tags: [1,2,14] }, 
            { src: "videos/3.mp4", tags: [2,5] }, 
            { src: "videos/4.mp4", tags: [1,4,3] }, 
            { src: "videos/5.mp4", tags: [3,8] }, 
            { src: "videos/6.mp4", tags: [8,9] }, 
            { src: "videos/7.mp4", tags: [1,3,14] }, 
            { src: "videos/8.mp4", tags: [1,6,5] }, 
            { src: "videos/9.mp4", tags: [2,5] }, 
            { src: "videos/10.mp4", tags: [12,1,4,14] }, 
            { src: "videos/11.mp4", tags: [1,4,2] }, 
            { src: "videos/12.mp4", tags: [1,4,3,14] }, 
            { src: "videos/13.mp4", tags: [12,3,1,14] }, 
            { src: "videos/14.mp4", tags: [12,1,2,14] }, 
            { src: "videos/15.mp4", tags: [1,4,11,8] }, 
            { src: "videos/16.mp4", tags: [2,7,6] }, 
            { src: "videos/17.mp4", tags: [2,1,14] }, 
            { src: "videos/18.mp4", tags: [1,12,14] }, 
            { src: "videos/19.mp4", tags: [1,12,2,14] }, 
            { src: "videos/20.mp4", tags: [2,5,14] }, 
            { src: "videos/21.mp4", tags: [2,5,6,14] }, 
            { src: "videos/22.mp4", tags: [6,2,1] }, 
            { src: "videos/23.mp4", tags: [10,3,6,1] }, 
            { src: "videos/24.mp4", tags: [6,2,7,10] }, 
            { src: "videos/25.mp4", tags: [6,2,7,10] }, 
            { src: "videos/26.mp4", tags: [6,7,4,14] }, 
            { src: "videos/27.mp4", tags: [4,2,1] }, 
            { src: "videos/28.mp4", tags: [6,2,1] }, 
            { src: "videos/29.mp4", tags: [3,4,14] }, 
            { src: "videos/30.mp4", tags: [6,7,3,14] }, 
            { src: "videos/31.mp4", tags: [6,3,4] }, 
            { src: "videos/32.mp4", tags: [6,4,1,14] }, 
            { src: "videos/33.mp4", tags: [6,1,5] }, 
            { src: "videos/34.mp4", tags: [4,1,2,14] }, 
            { src: "videos/35.mp4", tags: [3,4] }, 
            { src: "videos/36.mp4", tags: [3,4] }, 
            { src: "videos/37.mp4", tags: [9,7,13] }, 
            { src: "videos/38.mp4", tags: [9,7,3] }, 
            { src: "videos/39.mp4", tags: [9,13] }, 
            { src: "videos/40.mp4", tags: [11,12,8] }, 
            { src: "videos/41.mp4", tags: [9,13,3] }, 
            { src: "videos/42.mp4", tags: [9,3] }, 
            { src: "videos/43.mp4", tags: [9,13] }, 
            { src: "videos/44.mp4", tags: [9,5,14] }, 
            { src: "videos/45.mp4", tags: [10,4,14] }, 
            { src: "videos/46.mp4", tags: [10,3,5,14] }, 
            { src: "videos/47.mp4", tags: [10,4,1,2] }, 
            { src: "videos/48.mp4", tags: [10,4,1] }, 
            { src: "videos/49.mp4", tags: [2,10,12,3] }, 
            { src: "videos/50.mp4", tags: [10,9,13] }, 
            { src: "videos/51.mp4", tags: [10,13] }, 
            { src: "videos/52.mp4", tags: [7,6,5,14] }, 
            { src: "videos/53.mp4", tags: [11,5,14] }, 
            { src: "videos/54.mp4", tags: [11,5,3,14] }, 
            { src: "videos/55.mp4", tags: [11,9] }, 
            { src: "videos/56.mp4", tags: [11,13,9] }, 
            { src: "videos/57.mp4", tags: [11,7] }, 
            { src: "videos/58.mp4", tags: [11,7] }, 
            { src: "videos/59.mp4", tags: [11,3] }, 
            { src: "videos/60.mp4", tags: [6,3,4,14] }, 
            { src: "videos/61.mp4", tags: [11,13,5] }, 
            { src: "videos/62.mp4", tags: [13,3] }, 
            { src: "videos/64.mp4", tags: [12,3] }, 
            { src: "videos/65.mp4", tags: [12,10,8] }, 
            { src: "videos/66.mp4", tags: [12,10,8] }, 
            { src: "videos/67.mp4", tags: [12,10] }, 
            { src: "videos/68.mp4", tags: [12,8] }, 
            { src: "videos/69.mp4", tags: [12,3,8] }, 
            { src: "videos/70.mp4", tags: [6,2,5] }, 
        ];
        
        const antiVideoData = [
            { src: "videos/anti/1.mp4" },
            { src: "videos/anti/2.mp4" },
            { src: "videos/anti/3.mp4" }
        ];

        let filteredVideos = videoData;

        if (selectedTagIDs.length > 0) {

            filteredVideos = videoData.filter(video =>
                video.tags.some(tag =>
                    selectedTagIDs.includes(tag)
                )
            );
        }

        function injectAntiVideos(
            videos,
            antiVideos,
            interval = 8
        ) {

            const result = [];
            let antiIndex = 0;

            for (let i = 0; i < videos.length; i++) {

                result.push(videos[i]);

                if (
                    (i + 1) % interval === 0 &&
                    antiVideos.length > 0
                ) {

                    result.push({
                        ...antiVideos[antiIndex],
                        isAnti: true
                    });

                    antiIndex =
                        (antiIndex + 1) %
                        antiVideos.length;
                }
            }

            return result;
        }

        function lockScroll(duration = 3000) {

            scrollLocked = true;

            document.body.style.overflow = "hidden";

            setTimeout(() => {

                scrollLocked = false;

                document.body.style.overflow = "";

            }, duration);
        }

        const mergedVideos =
            injectAntiVideos(
                filteredVideos,
                antiVideoData,
                8
            );

        const appVideos =
            document.getElementById("appVideos");

        function renderVideos() {

            mergedVideos.forEach((video, index) => {

                const videoElement =
                    document.createElement("div");

                videoElement.classList.add("video");

                videoElement.setAttribute(
                    "data-index",
                    index
                );

                videoElement.innerHTML = `
                    <video
                        class="video_player"
                        src="${video.src}"
                        loop
                        playsinline
                        preload="auto"
                    ></video>

                    <div class="videoSidebar">
                        <div class="videoSidebar_button">
                            <button
                                class="settingsBtn"
                                onclick="openPopup(this)"
                            >
                                ⚙️
                            </button>
                        </div>

                        <div class="videoSidebar_button">
                            ❤️
                        </div>

                        <div class="videoSidebar_button">
                            👤
                        </div>
                    </div>

                    <div class="videoFooter">
                        <div class="videoFooter_text">
                            <p class="videoFooter_description">
                                ${video.description || ""}
                            </p>
                        </div>
                    </div>

                    <div class="settings">
                        <h1>imagine a burger</h1>

                        <p>test test test test</p>

                        <button
                            type="button"
                            onclick="closePopup(this)"
                        >
                            OK
                        </button>
                    </div>
                `;

                appVideos.appendChild(videoElement);
            });
        }

        renderVideos();

        const videos =
            document.querySelectorAll(".video_player");

        videos.forEach(video => {

            video.pause();
            video.muted = true;
        });

        function enablePlayback() {

            const visibleVideo =
                document.querySelector(
                    ".video[data-index='" +
                    currentVideoIndex +
                    "'] .video_player"
                );

            if (visibleVideo) {

                visibleVideo.muted = false;

                visibleVideo.play()
                    .catch(err => console.log(err));
            }
        }

        document.body.addEventListener(
            "touchstart",
            enablePlayback,
            { once: true }
        );

        document.body.addEventListener(
            "click",
            enablePlayback,
            { once: true }
        );

        window.addEventListener("load", () => {

            const savedIndex =
                parseInt(
                    localStorage.getItem(
                        "resumeVideoIndex"
                    )
                ) || 0;

            const targetVideoCard =
                document.querySelector(
                    `.video[data-index='${savedIndex}']`
                );

            if (targetVideoCard) {

                targetVideoCard.scrollIntoView({
                    behavior: "auto",
                    block: "start"
                });

                setTimeout(() => {

                    const targetVideo =
                        targetVideoCard.querySelector(
                            ".video_player"
                        );

                    if (targetVideo) {

                        currentVideoIndex = -1;

                        targetVideo.muted = false;

                        targetVideo.play()
                            .catch(err =>
                                console.log(err)
                            );
                    }

                }, 100);
            }
        });

        function openPopup(button) {

            const popup =
                button.closest(".video")
                    .querySelector(".settings");

            popup.classList.add("open-settings");
        }

        function closePopup(button) {

            const popup =
                button.closest(".settings");

            popup.classList.remove("open-settings");
        }

        function playOnlyVisible(videoToPlay) {

            videos.forEach((video) => {

                if (video === videoToPlay) {

                    if (!manuallyPaused) {

                        video.muted = false;

                        video.play()
                            .catch(err =>
                                console.log(err)
                            );
                    }

                } else {

                    video.pause();
                    video.muted = true;
                }
            });
        }

        const observer =
            new IntersectionObserver((entries) => {

                entries.forEach((entry) => {

                    const videoCard = entry.target;

                    const video =
                        videoCard.querySelector(
                            ".video_player"
                        );

                    const index =
                        parseInt(
                            videoCard.getAttribute(
                                "data-index"
                            )
                        );

                    if (
                        entry.isIntersecting &&
                        entry.intersectionRatio >= 0.6
                    ) {

                        manuallyPaused = false;

                        playOnlyVisible(video);

                        if (
                            currentVideoIndex !== index
                        ) {

                            currentVideoIndex = index;

                            if (
                                !mergedVideos[index]?.isAnti
                            ) {

                                scrollCount++;

                                localStorage.setItem(
                                    "scrollCount",
                                    scrollCount
                                );
                            }
                        }

                        const isAnti =
                            mergedVideos[index]?.isAnti;

                        // FIXED SECOND TO LAST DETECTION
                        const realVideosSeen =
                            mergedVideos
                                .slice(0, index + 1)
                                .filter(v => !v.isAnti)
                                .length;

                        const realVideoCount =
                            filteredVideos.length;

                        if (
                            realVideosSeen >=
                            realVideoCount - 1
                        ) {

                            localStorage.removeItem(
                                "resumeVideoIndex"
                            );

                            localStorage.setItem(
                                "resultType",
                                "fail"
                            );

                            window.location.href =
                                "results.html";

                            return;
                        }

                        if (
    isAnti &&
    !scrollLocked
) {

    lockScroll(3000);

    // SAVE next resume position
    localStorage.setItem(
        "resumeVideoIndex",
        index + 1
    );

    const antiNumber =
        mergedVideos
            .slice(0, index + 1)
            .filter(v => v.isAnti)
            .length;

    // FORCE anti video playback on iOS
    video.muted = false;

    video.play()
        .then(() => {

            // wait before allowing redirect
            setTimeout(() => {

                const goNext = () => {

                    window.removeEventListener(
                        "wheel",
                        goNext
                    );

                    window.removeEventListener(
                        "touchend",
                        goNext
                    );

                    if (antiNumber >= 3) {

                        localStorage.removeItem(
                            "resumeVideoIndex"
                        );

                        localStorage.setItem(
                            "resultType",
                            "fail"
                        );

                        window.location.href =
                            "results.html";

                    } else {

                        window.location.href =
                            "checkpoint.html";
                    }
                };

                // desktop
                window.addEventListener(
                    "wheel",
                    goNext,
                    { once: true }
                );

                // mobile
                window.addEventListener(
                    "touchend",
                    goNext,
                    { once: true }
                );

            }, 3000);

        })
        .catch(err => {
            console.log(err);
        });
}

                    } else {

                        video.pause();
                        video.muted = true;
                    }
                });

            }, {
                threshold: [0.6]
            });

        document.querySelectorAll(".video")
            .forEach((videoCard) => {

                observer.observe(videoCard);

                const video =
                    videoCard.querySelector(
                        ".video_player"
                    );

                video.load();

                videoCard.addEventListener(
                    "click",
                    (e) => {

                        if (
                            e.target.closest(
                                ".settingsBtn"
                            )
                        ) return;

                        if (video.paused) {

                            manuallyPaused = false;

                            video.muted = false;

                            video.play()
                                .catch(err =>
                                    console.log(err)
                                );

                        } else {

                            manuallyPaused = true;

                            video.pause();
                        }
                    }
                );
            });
        
        window.addEventListener(
            "wheel",
            (e) => {

                if (scrollLocked) {
                    e.preventDefault();
                }

            },
            { passive: false }
        );

        window.addEventListener(
            "touchmove",
            (e) => {

                if (scrollLocked) {
                    e.preventDefault();
                }

            },
            { passive: false }
        );

    </script>
</body>
</html>
