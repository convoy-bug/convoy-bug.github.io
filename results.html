<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Results</title>

<link rel="stylesheet" href="results.css" />

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
</head>

<body>

<div class="container">

    <h1 id="title"></h1>

    <div id="message"></div>

    <p>
        Videos viewed:
        <span id="count">0</span>
    </p>

    <p>
        Checkpoints reached:
        <span id="checkpointCount">0</span>
    </p>

</div>

<script>

document.addEventListener("DOMContentLoaded", () => {

    /* =========================
       VIDEO COUNT
    ========================= */

    const realVideosViewed =
        parseInt(localStorage.getItem("videosViewed")) || 0;

    document.getElementById("count").innerText = realVideosViewed;

    console.log("[RESULTS DEBUG]", "Videos Viewed:", realVideosViewed);


    /* =========================
       CHECKPOINT COUNT
    ========================= */

    const checkpointCount =
        parseInt(localStorage.getItem("checkpointCount")) || 0;

    document.getElementById("checkpointCount").innerText = checkpointCount;

    console.log("[RESULTS DEBUG]", "Checkpoint Count:", checkpointCount);


    /* =========================
       RESULT TYPE
    ========================= */

    const resultType = localStorage.getItem("resultType");

    const title = document.getElementById("title");
    const message = document.getElementById("message");

    if (resultType === "success") {

        title.innerText = "Congrats!";

        message.innerHTML = `
            <p>You stopped scrolling.</p>
            <br>
            <p>This project aims to make participants reflect on media habits.</p>
            <br>
            <p>Short-form content can heavily affect attention span and behavior.</p>
        `;

    } else {

        title.innerText =
            "You kept scrolling through and didn’t stop.";

        message.innerHTML = `
            <p>Consider setting limits on social media usage.</p>
            <br>
            <p>Mindless scrolling can affect focus and productivity.</p>
        `;
    }


    /* =========================
       CLEANUP (FIXED)
       ========================= */

    console.log("[RESULTS DEBUG]", "Cleaning session values...");

// session-only resets
localStorage.removeItem("resumeVideoIndex");
localStorage.removeItem("resultType");
localStorage.removeItem("videosViewed");

// ✅ IMPORTANT: reset checkpoint system for replay
localStorage.removeItem("checkpointCount");

// optional: reset checkpoint session guard
sessionStorage.removeItem("lastCheckpointVisit");
});

</script>
</body>
</html>
