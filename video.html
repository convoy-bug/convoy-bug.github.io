<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- mobile support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <title>TikTokClone</title>
    <link rel="stylesheet" href="video.css" />

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            overscroll-behavior: none;
            -webkit-overflow-scrolling: touch;
            overflow: hidden;
        }

        .app_videos {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
        }

        .video {
            height: 100vh;
            scroll-snap-align: start;
        }
    </style>
</head>
<body>

    <div class="app_videos" id="appVideos"></div>

    <script>

        let scrollCount =
            parseInt(localStorage.getItem("scrollCount")) || 0;

        let currentVideoIndex = -1;
        let manuallyPaused = false;
        let scrollLocked = false;
        let antiTriggered = false;

        const params = new URLSearchParams(window.location.search);

        const selectedTags = [];

        params.forEach((value, key) => {

            if (value === "on") {
                selectedTags.push(key);
            }
        });

        const TAGS = {
            funny: 1,
            absurd: 2,
            relatable: 3,
            skit: 4,
            popculture: 5,
            meme: 6,
            AI: 7,
            lifestyle: 8,
            informative: 9,
            food: 10,
            movie: 11,
            vlog: 12,
            critique: 13,
            filipino: 14
        };

        const selectedTagIDs = selectedTags
            .map(tag => TAGS[tag])
            .filter(Boolean);

        const videoData = [
            { src: "videos/1.mp4", tags: [1,4,3,14] },
            { src: "videos/2.mp4", tags: [1,2,14] },
            { src: "videos/3.mp4", tags: [2,5] },
            { src: "videos/4.mp4", tags: [1,4,3] },
            { src: "videos/5.mp4", tags: [3,8] },
            { src: "videos/6.mp4", tags: [8,9] },
            { src: "videos/7.mp4", tags: [1,3,14] },
            { src: "videos/8.mp4", tags: [1,6,5] },
            { src: "videos/9.mp4", tags: [2,5] },
            { src: "videos/10.mp4", tags: [12,1,4,14] }
        ];

        const antiVideoData = [
            { src: "videos/anti/1.mp4" },
            { src: "videos/anti/2.mp4" },
            { src: "videos/anti/3.mp4" }
        ];

        let filteredVideos = videoData;

        if (selectedTagIDs.length > 0) {

            filteredVideos = videoData.filter(video =>
                video.tags.some(tag =>
                    selectedTagIDs.includes(tag)
                )
            );
        }

        function injectAntiVideos(
            videos,
            antiVideos,
            interval = 8
        ) {

            const result = [];
            let antiIndex = 0;

            for (let i = 0; i < videos.length; i++) {

                result.push(videos[i]);

                if (
                    (i + 1) % interval === 0 &&
                    antiVideos.length > 0
                ) {

                    result.push({
                        ...antiVideos[antiIndex],
                        isAnti: true
                    });

                    antiIndex =
                        (antiIndex + 1) %
                        antiVideos.length;
                }
            }

            return result;
        }

        function lockScroll(duration = 3000) {

            scrollLocked = true;

            setTimeout(() => {

                scrollLocked = false;

            }, duration);
        }

        const mergedVideos =
            injectAntiVideos(
                filteredVideos,
                antiVideoData,
                8
            );

        const appVideos =
            document.getElementById("appVideos");

        function renderVideos() {

            mergedVideos.forEach((video, index) => {

                const videoElement =
                    document.createElement("div");

                videoElement.classList.add("video");

                videoElement.setAttribute(
                    "data-index",
                    index
                );

                videoElement.innerHTML = `
                    <video
                        class="video_player"
                        src="${video.src}"
                        loop
                        playsinline
                        webkit-playsinline
                        preload="auto"
                    ></video>

                    <div class="videoSidebar">
                        <div class="videoSidebar_button">
                            <button
                                class="settingsBtn"
                                onclick="openPopup(this)"
                            >
                                ⚙️
                            </button>
                        </div>

                        <div class="videoSidebar_button">
                            ❤️
                        </div>

                        <div class="videoSidebar_button">
                            👤
                        </div>
                    </div>

                    <div class="videoFooter">
                        <div class="videoFooter_text">
                            <p class="videoFooter_description">
                                ${video.description || ""}
                            </p>
                        </div>
                    </div>

                    <div class="settings">
                        <h1>imagine a burger</h1>

                        <p>test test test test</p>

                        <button
                            type="button"
                            onclick="closePopup(this)"
                        >
                            OK
                        </button>
                    </div>
                `;

                appVideos.appendChild(videoElement);
            });
        }

        renderVideos();

        const videos =
            document.querySelectorAll(".video_player");

        videos.forEach(video => {

            video.pause();
            video.muted = true;
            video.setAttribute("playsinline", "");
            video.setAttribute("webkit-playsinline", "");
        });

        function enablePlayback() {

            const visibleVideo =
                document.querySelector(
                    ".video[data-index='" +
                    currentVideoIndex +
                    "'] .video_player"
                );

            if (visibleVideo) {

                visibleVideo.muted = false;

                visibleVideo.play()
                    .catch(err => console.log(err));
            }
        }

        document.body.addEventListener(
            "touchstart",
            enablePlayback,
            { once: true }
        );

        document.body.addEventListener(
            "click",
            enablePlayback,
            { once: true }
        );

        window.addEventListener("load", () => {

            const savedIndex =
                parseInt(
                    localStorage.getItem(
                        "resumeVideoIndex"
                    )
                ) || 0;

            const targetVideoCard =
                document.querySelector(
                    `.video[data-index='${savedIndex}']`
                );

            if (targetVideoCard) {

                targetVideoCard.scrollIntoView({
                    behavior: "auto",
                    block: "start"
                });

                setTimeout(() => {

                    const targetVideo =
                        targetVideoCard.querySelector(
                            ".video_player"
                        );

                    if (targetVideo) {

                        currentVideoIndex = savedIndex;

                        targetVideo.muted = false;

                        targetVideo.play()
                            .catch(err =>
                                console.log(err)
                            );
                    }

                }, 300);
            }
        });

        function openPopup(button) {

            const popup =
                button.closest(".video")
                    .querySelector(".settings");

            popup.classList.add("open-settings");
        }

        function closePopup(button) {

            const popup =
                button.closest(".settings");

            popup.classList.remove("open-settings");
        }

        function playOnlyVisible(videoToPlay) {

            videos.forEach((video) => {

                if (video === videoToPlay) {

                    if (!manuallyPaused) {

                        video.muted = false;

                        const playPromise = video.play();

                        if (playPromise !== undefined) {

                            playPromise.catch(err =>
                                console.log(err)
                            );
                        }
                    }

                } else {

                    video.pause();
                    video.muted = true;
                }
            });
        }

        const observer =
            new IntersectionObserver((entries) => {

                entries.forEach((entry) => {

                    const videoCard = entry.target;

                    const video =
                        videoCard.querySelector(
                            ".video_player"
                        );

                    const index =
                        parseInt(
                            videoCard.getAttribute(
                                "data-index"
                            )
                        );

                    if (
                        entry.isIntersecting &&
                        entry.intersectionRatio >= 0.6
                    ) {

                        manuallyPaused = false;

                        playOnlyVisible(video);

                        if (
                            currentVideoIndex !== index
                        ) {

                            currentVideoIndex = index;

                            if (
                                !mergedVideos[index]?.isAnti
                            ) {

                                scrollCount++;

                                localStorage.setItem(
                                    "scrollCount",
                                    scrollCount
                                );
                            }
                        }

                        const isAnti =
                            mergedVideos[index]?.isAnti;

                        const realVideosSeen =
                            mergedVideos
                                .slice(0, index + 1)
                                .filter(v => !v.isAnti)
                                .length;

                        const realVideoCount =
                            filteredVideos.length;

                        // FINAL FAIL STATE
                        if (
                            realVideosSeen >=
                            realVideoCount
                        ) {

                            localStorage.removeItem(
                                "resumeVideoIndex"
                            );

                            localStorage.setItem(
                                "resultType",
                                "fail"
                            );

                            window.location.href =
                                "results.html";

                            return;
                        }

                        // ANTI VIDEO LOGIC
                        if (
                            isAnti &&
                            !scrollLocked &&
                            !antiTriggered
                        ) {

                            antiTriggered = true;

                            lockScroll(3000);

                            localStorage.setItem(
                                "resumeVideoIndex",
                                index + 1
                            );

                            const antiNumber =
                                mergedVideos
                                    .slice(0, index + 1)
                                    .filter(v => v.isAnti)
                                    .length;

                            video.pause();

                            video.currentTime = 0;

                            video.muted = false;

                            const promise =
                                video.play();

                            if (promise !== undefined) {

                                promise
                                    .then(() => {

                                        setTimeout(() => {

                                            if (
                                                antiNumber >= 3
                                            ) {

                                                localStorage.removeItem(
                                                    "resumeVideoIndex"
                                                );

                                                localStorage.setItem(
                                                    "resultType",
                                                    "fail"
                                                );

                                                window.location.href =
                                                    "results.html";

                                            } else {

                                                window.location.href =
                                                    "checkpoint.html";
                                            }

                                        }, 3000);

                                    })
                                    .catch(err => {

                                        console.log(err);

                                        setTimeout(() => {

                                            window.location.href =
                                                "checkpoint.html";

                                        }, 3000);
                                    });
                            }
                        }

                    } else {

                        video.pause();
                        video.muted = true;
                    }
                });

            }, {
                threshold: [0.6]
            });

        document.querySelectorAll(".video")
            .forEach((videoCard) => {

                observer.observe(videoCard);

                const video =
                    videoCard.querySelector(
                        ".video_player"
                    );

                video.load();

                videoCard.addEventListener(
                    "click",
                    (e) => {

                        if (
                            e.target.closest(
                                ".settingsBtn"
                            )
                        ) return;

                        if (video.paused) {

                            manuallyPaused = false;

                            video.muted = false;

                            video.play()
                                .catch(err =>
                                    console.log(err)
                                );

                        } else {

                            manuallyPaused = true;

                            video.pause();
                        }
                    }
                );
            });

        // FORCE ONE VIDEO PER SWIPE

        let touchStartY = 0;
        let touchEndY = 0;
        let isSnapping = false;

        const videoCards =
            document.querySelectorAll(".video");

        function snapToVideo(index) {

            if (
                index < 0 ||
                index >= videoCards.length ||
                isSnapping
            ) return;

            isSnapping = true;

            videoCards[index].scrollIntoView({
                behavior: "smooth",
                block: "start"
            });

            setTimeout(() => {

                isSnapping = false;

            }, 400);
        }

        appVideos.addEventListener(
            "touchstart",
            (e) => {

                touchStartY =
                    e.changedTouches[0].screenY;
            },
            { passive: true }
        );

        appVideos.addEventListener(
            "touchend",
            (e) => {

                if (
                    scrollLocked ||
                    isSnapping
                ) return;

                touchEndY =
                    e.changedTouches[0].screenY;

                const swipeDistance =
                    touchStartY - touchEndY;

                if (
                    Math.abs(swipeDistance) < 50
                ) return;

                if (swipeDistance > 0) {

                    snapToVideo(
                        currentVideoIndex + 1
                    );

                } else {

                    snapToVideo(
                        currentVideoIndex - 1
                    );
                }
            },
            { passive: true }
        );

        window.addEventListener(
            "wheel",
            (e) => {

                if (scrollLocked) {
                    e.preventDefault();
                }

            },
            { passive: false }
        );

        window.addEventListener(
            "touchmove",
            (e) => {

                if (scrollLocked) {
                    e.preventDefault();
                }

            },
            { passive: false }
        );

    </script>
</body>
</html>
