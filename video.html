<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <title>TikTokClone</title>
    <link rel="stylesheet" href="video.css" />
</head>

<body>
<div class="app_videos" id="appVideos"></div>

<script>

let scrollCount = parseInt(localStorage.getItem("scrollCount")) || 0;
let currentVideoIndex = -1;
let manuallyPaused = false;
let scrollLocked = false;

/* FIX: prevents repeated anti triggers per index */
let antiProcessingIndex = null;

const params = new URLSearchParams(window.location.search);
const selectedTags = [];

params.forEach((value, key) => {
    if (value === "on") selectedTags.push(key);
});

const TAGS = {
    funny: 1, absurd: 2, relatable: 3, skit: 4,
    popculture: 5, meme: 6, AI: 7, lifestyle: 8,
    informative: 9, food: 10, movie: 11,
    vlog: 12, critique: 13, filipino: 14
};

const selectedTagIDs = selectedTags.map(t => TAGS[t]).filter(Boolean);

const videoData = [ 
            { src: "videos/1.mp4", tags: [1,4,3,14] }, 
            { src: "videos/2.mp4", tags: [1,2,14] }, 
            { src: "videos/3.mp4", tags: [2,5] }, 
            { src: "videos/4.mp4", tags: [1,4,3] }, 
            { src: "videos/5.mp4", tags: [3,8] }, 
            { src: "videos/6.mp4", tags: [8,9] }, 
            { src: "videos/7.mp4", tags: [1,3,14] }, 
            { src: "videos/8.mp4", tags: [1,6,5] }, 
            { src: "videos/9.mp4", tags: [2,5] }, 
            { src: "videos/10.mp4", tags: [12,1,4,14] }, 
            { src: "videos/11.mp4", tags: [1,4,2] }, 
            { src: "videos/12.mp4", tags: [1,4,3,14] }, 
            { src: "videos/13.mp4", tags: [12,3,1,14] }, 
            { src: "videos/14.mp4", tags: [12,1,2,14] }, 
            { src: "videos/15.mp4", tags: [1,4,11,8] }, 
            { src: "videos/16.mp4", tags: [2,7,6] }, 
            { src: "videos/17.mp4", tags: [2,1,14] }, 
            { src: "videos/18.mp4", tags: [1,12,14] }, 
            { src: "videos/19.mp4", tags: [1,12,2,14] }, 
            { src: "videos/20.mp4", tags: [2,5,14] }, 
            { src: "videos/21.mp4", tags: [2,5,6,14] }, 
            { src: "videos/22.mp4", tags: [6,2,1] }, 
            { src: "videos/23.mp4", tags: [10,3,6,1] }, 
            { src: "videos/24.mp4", tags: [6,2,7,10] }, 
            { src: "videos/25.mp4", tags: [6,2,7,10] }, 
            { src: "videos/26.mp4", tags: [6,7,4,14] }, 
            { src: "videos/27.mp4", tags: [4,2,1] }, 
            { src: "videos/28.mp4", tags: [6,2,1] }, 
            { src: "videos/29.mp4", tags: [3,4,14] }, 
            { src: "videos/30.mp4", tags: [6,7,3,14] }, 
            { src: "videos/31.mp4", tags: [6,3,4] },

            { src: "videos/33.mp4", tags: [6,1,5] }, 
            { src: "videos/34.mp4", tags: [4,1,2,14] }, 
            { src: "videos/35.mp4", tags: [3,4] }, 
            { src: "videos/36.mp4", tags: [3,4] }, 
            { src: "videos/37.mp4", tags: [9,7,13] }, 
            { src: "videos/38.mp4", tags: [9,7,3] }, 
            { src: "videos/39.mp4", tags: [9,13] }, 
            { src: "videos/40.mp4", tags: [11,12,8] }, 
            { src: "videos/41.mp4", tags: [9,13,3] }, 
            { src: "videos/42.mp4", tags: [9,3] },

            { src: "videos/44.mp4", tags: [9,5,14] }, 
            { src: "videos/45.mp4", tags: [10,4,14] }, 
            { src: "videos/46.mp4", tags: [10,3,5,14] }, 
            { src: "videos/47.mp4", tags: [10,4,1,2] }, 
            { src: "videos/48.mp4", tags: [10,4,1] }, 
            { src: "videos/49.mp4", tags: [2,10,12,3] }, 
            { src: "videos/50.mp4", tags: [10,9,13] }, 
            { src: "videos/51.mp4", tags: [10,13] }, 
            { src: "videos/52.mp4", tags: [7,6,5,14] }, 
            { src: "videos/53.mp4", tags: [11,5,14] },

            { src: "videos/55.mp4", tags: [11,9] }, 
            { src: "videos/56.mp4", tags: [11,13,9] }, 
            { src: "videos/57.mp4", tags: [11,7] }, 
            { src: "videos/58.mp4", tags: [11,7] },

            { src: "videos/60.mp4", tags: [6,3,4,14] }, 
            { src: "videos/61.mp4", tags: [11,13,5] }, 
            { src: "videos/62.mp4", tags: [13,3] }, 
            { src: "videos/64.mp4", tags: [12,3] }, 
            { src: "videos/65.mp4", tags: [12,10,8] }, 
            { src: "videos/66.mp4", tags: [12,10,8] }, 
            { src: "videos/67.mp4", tags: [12,10] }, 
            { src: "videos/68.mp4", tags: [12,8] }, 
            { src: "videos/69.mp4", tags: [12,3,8] }, 
            { src: "videos/70.mp4", tags: [6,2,5] }, 
        ];

const antiVideoData = [
    { src: "videos/anti/1.mp4" },
    { src: "videos/anti/2.mp4" },
    { src: "videos/anti/3.mp4" }
];

let filteredVideos = videoData;

if (selectedTagIDs.length > 0) {
    filteredVideos = videoData.filter(v =>
        v.tags.some(t => selectedTagIDs.includes(t))
    );
}

function injectAntiVideos(videos, antiVideos, interval = 8) {
    const result = [];
    let antiIndex = 0;

    for (let i = 0; i < videos.length; i++) {
        result.push(videos[i]);

        if ((i + 1) % interval === 0 && antiVideos.length) {
            result.push({
                ...antiVideos[antiIndex],
                isAnti: true
            });

            antiIndex = (antiIndex + 1) % antiVideos.length;
        }
    }

    return result;
}

function lockScroll(duration = 3000) {
    scrollLocked = true;
    setTimeout(() => scrollLocked = false, duration);
}

const mergedVideos = injectAntiVideos(filteredVideos, antiVideoData, 8);
const appVideos = document.getElementById("appVideos");

function renderVideos() {
    mergedVideos.forEach((video, index) => {
        const el = document.createElement("div");
        el.className = "video";
        el.dataset.index = index;

        el.innerHTML = `
            <video
                class="video_player"
                src="${video.src}"
                loop
                playsinline
                webkit-playsinline
                preload="auto"
                muted
            ></video>
        `;

        appVideos.appendChild(el);
    });
}

renderVideos();

const videos = document.querySelectorAll(".video_player");

videos.forEach(v => {
    v.pause();
    v.muted = true;
    v.setAttribute("playsinline", "");
    v.setAttribute("webkit-playsinline", "");
});

/* safer playback for iOS */
function safePlay(video) {
    if (!video) return;

    video.muted = true;
    video.load();

    const p = video.play();
    if (p && p.catch) p.catch(() => {});
}

function playOnlyVisible(videoToPlay) {
    videos.forEach(v => {
        if (v === videoToPlay) {
            if (!manuallyPaused) safePlay(v);
        } else {
            v.pause();
            v.muted = true;
        }
    });
}

/* OBSERVER */
const observer = new IntersectionObserver((entries) => {

    entries.forEach(entry => {

        const card = entry.target;
        const video = card.querySelector(".video_player");
        const index = parseInt(card.dataset.index);

        if (entry.isIntersecting && entry.intersectionRatio >= 0.6) {

            manuallyPaused = false;

            playOnlyVisible(video);

            currentVideoIndex = index;

            const isAnti = mergedVideos[index]?.isAnti;

            const realSeen =
                mergedVideos.slice(0, index + 1)
                    .filter(v => !v.isAnti).length;

            const realTotal = filteredVideos.length;

            /* FAIL CONDITION */
            if (realSeen >= realTotal) {
                localStorage.removeItem("resumeVideoIndex");
                localStorage.setItem("resultType", "fail");
                window.location.href = "results.html";
                return;
            }

            /* ANTI VIDEO FIXED FLOW */
            if (isAnti && !scrollLocked && antiProcessingIndex !== index) {

                antiProcessingIndex = index;

                lockScroll(3000);

                localStorage.setItem("resumeVideoIndex", index + 1);

                const antiCount =
                    mergedVideos.slice(0, index + 1)
                        .filter(v => v.isAnti).length;

                // IMPORTANT: force iOS readiness
                video.pause();
                video.currentTime = 0;
                video.muted = true;
                video.load();

                setTimeout(() => {
                    safePlay(video);
                }, 150);

                // WAIT before redirect so iOS actually starts playback
                setTimeout(() => {

                    antiProcessingIndex = null;

                    if (antiCount >= 3) {
                        localStorage.removeItem("resumeVideoIndex");
                        localStorage.setItem("resultType", "fail");
                        window.location.href = "results.html";
                    } else {
                        window.location.href = "checkpoint.html";
                    }

                }, 3500);
            }

        } else {
            video.pause();
            video.muted = true;
        }
    });

}, { threshold: 0.6 });

document.querySelectorAll(".video").forEach(card => {
    observer.observe(card);

    const v = card.querySelector(".video_player");
    v.load();

    card.addEventListener("click", (e) => {
        if (e.target.closest(".settingsBtn")) return;

        if (v.paused) {
            manuallyPaused = false;
            safePlay(v);
        } else {
            manuallyPaused = true;
            v.pause();
        }
    });
});

let touchStartY = 0;
let isSnapping = false;
const videoCards = document.querySelectorAll(".video");

function snapTo(index) {
    if (index < 0 || index >= videoCards.length || isSnapping) return;

    isSnapping = true;

    videoCards[index].scrollIntoView({
        behavior: "smooth",
        block: "start"
    });

    setTimeout(() => isSnapping = false, 400);
}

appVideos.addEventListener("touchstart", e => {
    touchStartY = e.changedTouches[0].screenY;
}, { passive: true });

appVideos.addEventListener("touchend", e => {

    if (scrollLocked || isSnapping) return;

    const delta = touchStartY - e.changedTouches[0].screenY;

    if (Math.abs(delta) < 50) return;

    if (delta > 0) snapTo(currentVideoIndex + 1);
    else snapTo(currentVideoIndex - 1);

}, { passive: true });

</script>
</body>
</html>
