<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Checkpoint</title>

<link rel="stylesheet" href="checkpoint.css" />

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
</head>

<body>

<div class="container">

    <picture>
        <img src="iskamskrol_logo.png" alt="Iskamskrol Logo">
    </picture>

    <h1>Iskamskrol</h1>

    <p>We hope you've been enjoying your experience</p>
    <p>But before we can continue we'd like to ask for some feedback</p>
    <p>Do you want to continue scrolling?</p>

    <button id="stopBtn">Stop</button>
    <button id="continueBtn">Continue</button>

</div>

<script>

/* CHECKPOINT VISIT TRACKING (FIXED) */

// get current count
let checkpointCount = parseInt(localStorage.getItem("checkpointCount")) || 0;

// prevent double-counting in same session load
const lastCheckpointVisit = sessionStorage.getItem("lastCheckpointVisit");

// only count if this is a NEW visit in this session
if (!lastCheckpointVisit) {
    checkpointCount++;
    localStorage.setItem("checkpointCount", checkpointCount);
    sessionStorage.setItem("lastCheckpointVisit", "1");
}

/* DEBUG: videos viewed */
const videosViewed =
    parseInt(localStorage.getItem("videosScrolled")) || 0;

console.log(
    "[CHECKPOINT DEBUG]",
    "Videos Viewed:",
    videosViewed,
    "| Checkpoints Reached:",
    checkpointCount
);

/* STOP → RESULTS */
document.getElementById("stopBtn").addEventListener("click", () => {

    console.log(
        "[STOP CLICKED]",
        "Final Videos Viewed:",
        videosViewed
    );

    localStorage.setItem("resultType", "success");
    localStorage.removeItem("resumeVideoIndex");

    window.location.href = "results.html";
});

/* CONTINUE → BACK TO FEED */
document.getElementById("continueBtn").addEventListener("click", () => {

    console.log(
        "[CONTINUE CLICKED]",
        "Resuming Feed At Index:",
        localStorage.getItem("resumeVideoIndex"),
        "| Videos Viewed:",
        videosViewed
    );

    // allow next checkpoint visit to count again
    sessionStorage.removeItem("lastCheckpointVisit");

    window.location.href = "index.html";
});

</script>

</body>
</html>
