<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Results</title>

<link rel="stylesheet" href="results.css" />

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
</head>

<body>

<div class="container">

    <h1 id="title"></h1>

    <div id="message"></div>

    <p>
        Checkpoints reached:
        <span id="checkpointCount">0</span>
    </p>

</div>

<script>

document.addEventListener("DOMContentLoaded", () => {

    const checkpointCount =
        parseInt(localStorage.getItem("checkpointCount")) || 0;

    document.getElementById("checkpointCount").innerText =
        checkpointCount;

    const resultType =
        localStorage.getItem("resultType");

    const title = document.getElementById("title");
    const message = document.getElementById("message");

    if (resultType === "success") {

        title.innerText = "Congrats!";

        message.innerHTML = `
            <p>You stopped scrolling.</p>
            <br>
            <p>
                This project reflects on media consumption habits
                and short-form content addiction.
            </p>
        `;

    } else {

        title.innerText =
            "You kept scrolling through and didn’t stop.";

        message.innerHTML = `
            <p>
                Consider setting limits for social media use
                to reduce mindless scrolling.
            </p>
        `;
    }

    /* =========================
       FULL RESET (NEW SYSTEM SAFE)
    ========================= */
    localStorage.removeItem("resultType");
    localStorage.removeItem("resumeVideoIndex");
    localStorage.removeItem("checkpointCount");

});

</script>

</body>
</html>
