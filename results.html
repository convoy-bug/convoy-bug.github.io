<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Results</title>

<link rel="stylesheet" href="results.css" />

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
</head>

<body>

<div class="container">

    <h1 id="title"></h1>

    <div id="message"></div>

    <p>
        Videos viewed:
        <span id="count">0</span>
    </p>

    <p>
        Checkpoints reached:
        <span id="checkpointCount">0</span>
    </p>

</div>

<script>

document.addEventListener("DOMContentLoaded", () => {

    /* =========================
       VIDEO COUNT
       ========================= */

    /* resumeVideoIndex stores merged index
       so we convert it into REAL videos only */

    const mergedIndex =
        parseInt(localStorage.getItem("resumeVideoIndex")) || 0;

    /* anti appears every 9th slot
       (8 real + 1 anti) */

    const antiSeen =
        Math.floor(mergedIndex / 9);

    const realVideosViewed =
        Math.max(0, mergedIndex - antiSeen);

    document.getElementById("count").innerText =
        realVideosViewed;

    /* =========================
       CHECKPOINT COUNT
       ========================= */

    const checkpointCount =
        parseInt(
            localStorage.getItem("checkpointCount")
        ) || 0;

    document.getElementById(
        "checkpointCount"
    ).innerText = checkpointCount;

    /* =========================
       RESULT TYPE
       ========================= */

    const resultType =
        localStorage.getItem("resultType");

    const title =
        document.getElementById("title");

    const message =
        document.getElementById("message");

    /* SUCCESS */
    if (resultType === "success") {

        title.innerText = "Congrats!";

       message.innerHTML = `

                <p>You stopped scrolling.</p>

                <br>

                <p>
                    This project aims to make
                    participants reflect on their media
                    habits and the quality of content they
                    choose to consume.
                </p>

                <br>

                <p>
                    Highly addictive algorithms can
                    instill habits like zombie scrolling
                    (the tendency to mindlessly scroll)
                    and bed rotting (consuming content
                    while stuck in bed).
                </p>

                <br>

                <p>
                    Pairing this with low quality,
                    short form, overstimulating
                    “brain rot” content can impact
                    your mental development and
                    cognitive functions.
                </p>
            `;

    /* FAIL */
    } else {

        title.innerText =
            "You kept scrolling through and didn’t stop.";

        message.innerHTML = `

                <p>
                    It would be good to set timers
                    when using social media or doing
                    a social media detox to lessen the
                    effects of brain rot and exposure
                    to brain rot content.
                </p>

                <br>

                <p>
                    Kindly write your name in your
                    brain and paste it on the wall.
                </p>

                <br>

                <p>
                    I hope you learned more about
                    brain rot or gained a new
                    perspective on your media habits.
                </p>
            `;
    }

    /* =========================
       FULL RESET
       ========================= */

    localStorage.removeItem("resumeVideoIndex");
    localStorage.removeItem("checkpointCount");
    localStorage.removeItem("resultType");

});

</script>
</body>
</html>
